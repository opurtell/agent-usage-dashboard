<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Usage Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --bg: #0f1117;
            --card: #1a1d27;
            --border: #2a2d3a;
            --text: #e1e4ed;
            --text-muted: #8b8fa3;
            --accent-zai: #7c5cfc;
            --accent-openai: #10a37f;
            --accent-claude: #d4a574;
            --danger: #ef4444;
            --warning: #f59e0b;
            --success: #22c55e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 0.75rem;
        }

        .header-left h1 {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .last-updated {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .refresh-btn {
            background: rgba(255,255,255,0.08);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            transition: all 0.2s;
        }

        .refresh-btn:hover { background: rgba(255,255,255,0.12); }
        .refresh-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .refresh-btn .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid var(--text-muted);
            border-top-color: var(--text);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Provider cards */
        .provider-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .provider-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            position: relative;
            overflow: hidden;
        }

        .provider-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
        }

        .provider-card.claude::before { background: var(--accent-claude); }
        .provider-card.codex::before { background: var(--accent-openai); }
        .provider-card.zai::before { background: var(--accent-zai); }

        .provider-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.25rem;
        }

        .provider-name {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .provider-plan {
            font-size: 0.75rem;
            padding: 0.2rem 0.6rem;
            border-radius: 999px;
            background: rgba(255,255,255,0.08);
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        /* Period bars */
        .period {
            margin-bottom: 1rem;
        }

        .period-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 0.35rem;
        }

        .period-label {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .period-pct {
            font-size: 0.85rem;
            font-weight: 600;
        }

        .period-bar {
            height: 8px;
            background: rgba(255,255,255,0.06);
            border-radius: 4px;
            overflow: hidden;
        }

        .period-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.6s ease;
            min-width: 2px;
        }

        .period-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.72rem;
            color: var(--text-muted);
            margin-top: 0.25rem;
        }

        .period-fill.claude { background: var(--accent-claude); }
        .period-fill.codex { background: var(--accent-openai); }
        .period-fill.zai { background: var(--accent-zai); }
        .period-fill.warning { background: var(--warning); }
        .period-fill.danger { background: var(--danger); }
        .period-fill.pace-ok { background: var(--success); }

        /* Pace indicator */
        .pace-badge {
            display: inline-block;
            font-size: 0.7rem;
            padding: 0.15rem 0.4rem;
            border-radius: 4px;
            font-weight: 500;
            margin-left: 0.4rem;
        }

        .pace-badge.ahead { background: rgba(34,197,94,0.15); color: var(--success); }
        .pace-badge.on-track { background: rgba(34,197,94,0.1); color: #86efac; }
        .pace-badge.over { background: rgba(245,158,11,0.15); color: var(--warning); }
        .pace-badge.critical { background: rgba(239,68,68,0.15); color: var(--danger); }

        .reset-info {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 0.75rem;
        }

        /* Empty state */
        .empty-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 180px;
            color: var(--text-muted);
            gap: 0.5rem;
        }

        .empty-card .icon { font-size: 2rem; opacity: 0.4; }

        /* Error banner */
        .error-banner {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            margin-bottom: 1.5rem;
            font-size: 0.85rem;
            color: #fca5a5;
            display: none;
        }

        .error-banner.visible { display: block; }

        /* Config note */
        .config-note {
            background: rgba(124, 92, 252, 0.08);
            border: 1px solid rgba(124, 92, 252, 0.2);
            border-radius: 8px;
            padding: 1rem 1.25rem;
            margin-bottom: 1.5rem;
            font-size: 0.85rem;
            color: #c4b5fd;
        }

        .config-note code {
            background: rgba(255,255,255,0.08);
            padding: 0.15rem 0.4rem;
            border-radius: 4px;
            font-size: 0.82rem;
        }

        /* Loading skeleton */
        .skeleton-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            min-height: 200px;
        }

        .skeleton {
            background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.07) 50%, rgba(255,255,255,0.03) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 4px;
        }

        .skeleton.w-full { width: 100%; height: 12px; margin-bottom: 0.75rem; }
        .skeleton.w-2/3 { width: 66%; height: 12px; margin-bottom: 0.75rem; }
        .skeleton.w-1/3 { width: 33%; height: 8px; margin-bottom: 0.5rem; }
        .skeleton.w-1/2 { width: 50%; height: 8px; margin-bottom: 0.5rem; }
        .skeleton.bar { width: 100%; height: 8px; margin-bottom: 0.5rem; }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        /* Status line overview */
        .status-line {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1rem 1.5rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 1.5rem;
            flex-wrap: wrap;
            font-size: 0.9rem;
        }

        .status-provider {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .status-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
        }

        .status-dot.claude { background: var(--accent-claude); }
        .status-dot.codex { background: var(--accent-openai); }
        .status-dot.zai { background: var(--accent-zai); }
        .status-dot.unconfigured { background: var(--text-muted); opacity: 0.4; }

        @media (max-width: 768px) {
            .container { padding: 1rem; }
            .provider-grid { grid-template-columns: 1fr; }
            .status-line { flex-direction: column; align-items: flex-start; }
        }

        footer {
            text-align: center;
            padding: 2rem 0;
            color: var(--text-muted);
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-left">
                <h1>🤖 AI Usage Dashboard</h1>
            </div>
            <div class="header-right">
                <span class="last-updated" id="lastUpdated">—</span>
                <button class="refresh-btn" id="refreshBtn" onclick="refresh(true)">
                    ↻ Refresh
                </button>
            </div>
        </header>

        <div class="config-note" id="configNote" style="display:none">
            <!-- Shown when API URL isn't configured -->
        </div>

        <div class="error-banner" id="errorBanner"></div>

        <!-- Quick status line -->
        <div class="status-line" id="statusLine">
            <span style="color:var(--text-muted)">Loading…</span>
        </div>

        <!-- Provider cards -->
        <div class="provider-grid" id="providerGrid">
            <div class="skeleton-card"><div class="skeleton w-2/3"></div><div class="skeleton bar"></div><div class="skeleton w-1/2"></div><div class="skeleton bar"></div><div class="skeleton w-1/3"></div></div>
            <div class="skeleton-card"><div class="skeleton w-2/3"></div><div class="skeleton bar"></div><div class="skeleton w-1/2"></div><div class="skeleton bar"></div><div class="skeleton w-1/3"></div></div>
            <div class="skeleton-card"><div class="skeleton w-2/3"></div><div class="skeleton bar"></div><div class="skeleton w-1/2"></div><div class="skeleton bar"></div><div class="skeleton w-1/3"></div></div>
        </div>

        <footer>
            Powered by <a href="https://github.com/joshuadavidthomas/vibeusage" target="_blank" style="color:var(--text-muted)">vibeusage</a> · Data refreshed on demand
        </footer>
    </div>

    <script>
        // Configure your VPS API endpoint here:
        // For GH Pages deployment, this should be your VPS public URL
        const API_URL = window.__API_URL__ || '';

        function getApiUrl() {
            // Check URL params, then config, then relative
            const params = new URLSearchParams(window.location.search);
            return params.get('api') || API_URL || '';
        }

        async function fetchUsage(forceFresh = false) {
            const base = getApiUrl();
            if (!base) {
                throw new Error('API URL not configured. Add ?api=http://your-vps:3199 to the URL.');
            }
            const url = `${base}/api/usage${forceFresh ? '?fresh=1' : ''}`;
            const res = await fetch(url);
            if (!res.ok) throw new Error(`API returned ${res.status}`);
            return await res.json();
        }

        function getPaceClass(usedPct, elapsedPct) {
            if (usedPct === 0) return 'on-track';
            const ratio = usedPct / Math.max(elapsedPct, 1);
            if (ratio <= 1.15) return 'ahead';
            if (ratio <= 1.3) return 'on-track';
            if (ratio <= 1.7) return 'over';
            return 'critical';
        }

        function getPaceLabel(usedPct, elapsedPct) {
            const cls = getPaceClass(usedPct, elapsedPct);
            const labels = { 'ahead': 'On pace', 'on-track': 'Slightly over', 'over': 'Over pace', 'critical': 'Critical' };
            return `<span class="pace-badge ${cls}">${labels[cls]}</span>`;
        }

        function getFillClass(baseColor, usedPct, elapsedPct) {
            if (usedPct > 90) return 'danger';
            if (usedPct > 70 || getPaceClass(usedPct, elapsedPct) === 'critical') return 'warning';
            return baseColor;
        }

        function formatReset(resetAt) {
            if (!resetAt) return '';
            const d = new Date(resetAt);
            const now = new Date();
            const diff = d - now;
            if (diff <= 0) return 'Resetting soon';
            const h = Math.floor(diff / 3600000);
            const m = Math.floor((diff % 3600000) / 60000);
            if (h > 0) return `Resets in ${h}h ${m}m`;
            return `Resets in ${m}m`;
        }

        function renderProviderCard(id, name, cssClass, provider) {
            if (!provider) {
                return `<div class="provider-card ${cssClass}">
                    <div class="empty-card">
                        <div class="icon">—</div>
                        <div>Not configured</div>
                        <div style="font-size:0.75rem">Run <code>vibeusage auth ${id}</code></div>
                    </div>
                </div>`;
            }

            const periods = provider.periods || [];
            const tier = provider.tier || '';

            let periodsHtml = '';
            for (const p of periods) {
                const usedPct = p.used_percentage || 0;
                const totalPct = 100;
                const elapsedPct = p.elapsed_percentage || p.pace_elapsed || 50;
                const fillClass = getFillClass(cssClass, usedPct, elapsedPct);
                const paceLabel = elapsedPct ? getPaceLabel(usedPct, elapsedPct) : '';

                periodsHtml += `
                <div class="period">
                    <div class="period-header">
                        <span class="period-label">${p.label || p.type || 'Usage'}</span>
                        <span class="period-pct">${usedPct.toFixed(1)}%${paceLabel}</span>
                    </div>
                    <div class="period-bar">
                        <div class="period-fill ${fillClass}" style="width:${Math.min(usedPct, 100)}%"></div>
                    </div>
                    <div class="period-meta">
                        <span>${p.used_label || `${usedPct.toFixed(1)}% used`}</span>
                        <span>${formatReset(p.resets_at)}</span>
                    </div>
                </div>`;
            }

            return `
            <div class="provider-card ${cssClass}">
                <div class="provider-header">
                    <span class="provider-name">${name}</span>
                    ${tier ? `<span class="provider-plan">${tier}</span>` : ''}
                </div>
                ${periodsHtml || '<div class="empty-card"><div>No period data available</div></div>'}
                ${provider.extra_info ? `<div class="reset-info">${provider.extra_info}</div>` : ''}
            </div>`;
        }

        function renderStatusLine(providers) {
            const known = {
                claude: { name: 'Claude', css: 'claude' },
                codex: { name: 'Codex/ChatGPT', css: 'codex' },
                zai: { name: 'Z.ai', css: 'zai' }
            };

            let html = '';
            for (const [id, info] of Object.entries(known)) {
                const p = providers[id];
                if (!p) {
                    html += `<div class="status-provider"><span class="status-dot unconfigured"></span><span style="color:var(--text-muted)">${info.name}</span></div>`;
                    continue;
                }
                const mainPeriod = (p.periods || [])[0];
                const pct = mainPeriod ? `${mainPeriod.used_percentage?.toFixed(0)}%` : '—';
                html += `<div class="status-provider"><span class="status-dot ${info.css}"></span><span><strong>${info.name}</strong> ${pct}</span></div>`;
            }
            return html;
        }

        function render(data) {
            const resp = data.data || data;

            // Handle vibeusage JSON structure
            // vibeusage --json outputs: { providers: [ { id, name, tier, periods: [...] } ] }
            const providerList = resp.providers || [];

            // Build a map by id
            const providerMap = {};
            for (const p of providerList) {
                providerMap[p.id] = p;
            }

            // Update status line
            document.getElementById('statusLine').innerHTML = renderStatusLine(providerMap);

            // Update cards
            const grid = document.getElementById('providerGrid');
            grid.innerHTML =
                renderProviderCard('claude', 'Claude', 'claude', providerMap.claude) +
                renderProviderCard('codex', 'Codex / ChatGPT', 'codex', providerMap.codex) +
                renderProviderCard('zai', 'Z.ai (GLM Coding Plan)', 'zai', providerMap.zai);

            // Timestamp
            const fetched = data.fetched_at ? new Date(data.fetched_at) : new Date();
            const age = data.age_seconds || 0;
            const ageLabel = age < 5 ? 'just now' : `${age}s ago`;
            document.getElementById('lastUpdated').textContent =
                `Updated ${fetched.toLocaleTimeString()}${data.stale ? ' (stale)' : ''} · ${ageLabel}`;
        }

        function showError(msg) {
            const banner = document.getElementById('errorBanner');
            banner.textContent = msg;
            banner.classList.add('visible');
        }

        function hideError() {
            document.getElementById('errorBanner').classList.remove('visible');
        }

        async function refresh(forceFresh = false) {
            const btn = document.getElementById('refreshBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Loading';
            hideError();

            try {
                const data = await fetchUsage(forceFresh);
                if (!data.ok && data.error) {
                    showError(data.error);
                }
                if (data.data) {
                    render(data);
                }
            } catch (e) {
                showError(e.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '↻ Refresh';
            }
        }

        // Auto-load on page open
        refresh(false);
    </script>
</body>
</html>
